<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0c; color: #e4e4e7; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl">
        <h1 class="text-xl font-bold text-center mb-1">Admin Login</h1>
        <p class="text-xs text-zinc-500 text-center mb-6">データ管理パネル</p>
        {% if error %}
        <div class="mb-4 text-sm text-red-400 bg-red-950/40 border border-red-900 rounded-lg px-3 py-2">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/login" class="space-y-4">
            <div>
                <label class="block text-xs text-zinc-400 mb-1">ユーザー名</label>
                <input type="text" name="username" required autocomplete="username"
                    class="w-full px-3 py-2.5 rounded-lg bg-zinc-950 border border-zinc-700 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs text-zinc-400 mb-1">パスワード</label>
                <input type="password" name="password" required autocomplete="current-password"
                    class="w-full px-3 py-2.5 rounded-lg bg-zinc-950 border border-zinc-700 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit"
                class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition">
                ログイン
            </button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin ビルドカード生成</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const ver = "{{ ver }}";
        console.log("現在のデータ:", ver);
    </script>
    <style>
        body { background-color: #0a0a0c; color: white; font-family: 'Inter', sans-serif; }
        .drag-none { user-drag: none; -webkit-user-drag: none; }
        .rarity-5 { border-color: #cd8834; }
        .rarity-4 { border-color: #a256d1; }
        .rarity-3 { border-color: #5a8dc7; }
        .rarity-2 { border-color: #4a8a5c; }
        .picker-grid::-webkit-scrollbar { width: 8px; }
        .picker-grid::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; }
        .picker-tile { transition: transform .15s ease, border-color .15s ease; }
        .picker-tile:hover { transform: translateY(-2px); }
        .picker-tile.selected { border-color: #22d3ee !important; box-shadow: 0 0 0 2px rgba(34,211,238,0.4); }
        .combo-tile { transition: transform .15s ease, border-color .15s ease; }
        .combo-tile:hover { transform: translateY(-2px); }
        .combo-tile.active { border-color: #22d3ee !important; box-shadow: 0 0 0 2px rgba(34,211,238,0.5); }
        .combo-remove {
            position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
            background: #ef4444; color: white; border-radius: 9999px; font-size: 12px;
            line-height: 18px; text-align: center; cursor: pointer; z-index: 10;
        }
        .weapon-badge {
            position: absolute; bottom: -4px; right: -4px; width: 20px; height: 20px;
            border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); overflow: hidden;
            background: #18181b;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-yellow-400">UID: <span id="currentUid">{{ uid }}</span> のキャラクター一覧</h1>
                <span class="text-sm text-zinc-400 bg-zinc-800/60 px-3 py-1 rounded-lg border border-zinc-700">{{ ver }}</span>
            </div>
            <a href="/" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-sm rounded-lg transition-all border border-zinc-700">← 戻る</a>
        </div>
        
        <div id="charThumbRow" class="grid gap-[5px] grid-cols-4 sm:grid-cols-6 md:grid-cols-12 mb-6 bg-zinc-900/60 p-4 rounded-xl border border-zinc-800">
            {% for char in char_list %}
            <div class="relative aspect-square cursor-pointer char-thumb" data-char-id="{{ char.id }}">
                <img src="{{ char.icon }}" 
                     class="w-full h-full bg-gradient-to-tr from-[rgba(49,43,71,0.53)] to-[rgba(102,115,150,0.42)] rounded-lg object-cover opacity-50 grayscale-[0.3] transition-all hover:opacity-100 drag-none">
            </div>
            {% endfor %}
        </div>

        <div class="mb-6 p-4 bg-zinc-900/60 rounded-xl border border-zinc-800">
            <div class="text-xs font-semibold text-gray-400 mb-3">キャラ差し替え</div>
            <div id="comboRow" class="flex flex-wrap gap-3"></div>
        </div>

        <div class="mb-6 p-4 bg-zinc-900/80 rounded-xl border border-zinc-800 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2">
                    <label for="scoreCalcSelect" class="text-sm font-semibold text-gray-300">計算方法:</label>
                    <select id="scoreCalcSelect" class="bg-zinc-800 border border-zinc-700 text-white px-3 py-1.5 rounded-lg focus:outline-none focus:border-yellow-400 transition-all text-sm cursor-pointer">
                        <option value="crit">会心</option>
                        <option value="atk">攻撃力%</option>
                        <option value="hp">HP%</option>
                        <option value="def">防御%</option>
                        <option value="em">元素熟知</option>
                        <option value="charge">チャージ効率</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <label class="text-sm font-semibold text-gray-300">武器:</label>
                    <button id="editWeaponBtn" type="button"
                        class="flex items-center gap-2 bg-zinc-800 border border-zinc-700 hover:border-cyan-400 text-white pl-1.5 pr-3 py-1.5 rounded-lg transition-all text-sm">
                        <img id="editWeaponIcon" src="" class="w-7 h-7 rounded object-cover hidden">
                        <span id="editWeaponLabel">なし（実データ）</span>
                    </button>
                </div>
            </div>

            <button id="regenerateApiBtn" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white text-sm font-bold rounded-lg shadow-lg shadow-cyan-600/10 transition-all flex items-center gap-1.5">
                再取得 + 再生成
            </button>
        </div>

        <div class="flex justify-center bg-zinc-950 p-4 md:p-8 rounded-2xl border border-zinc-900 min-h-[400px] items-center relative">
            <div id="loadingSpinner" class="hidden absolute inset-0 bg-black/50 backdrop-blur-sm rounded-2xl flex items-center justify-center z-10">
                <div class="animate-spin h-10 w-10 border-4 border-yellow-400 border-t-transparent rounded-full"></div>
            </div>
            <img id="cardImage" src="" class="max-w-full h-auto rounded-lg shadow-2xl drag-none hidden">
            <div id="placeholderText" class="text-zinc-500 text-sm">キャラクターを選択してください</div>
        </div>
    </div>

    <div id="fakeCharModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4"
        onclick="if(event.target===this) closeFakeCharModal()">
        <div class="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-zinc-800 shrink-0">
                <h2 class="text-lg font-bold text-cyan-400">追加する差し替えキャラクターを選択</h2>
                <button onclick="closeFakeCharModal()" class="text-zinc-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div id="fakeCharGridStatus" class="p-4 text-sm text-zinc-400"></div>
            <div id="fakeCharGrid" class="picker-grid overflow-y-auto p-4 flex flex-wrap gap-2 flex-1 min-h-0"></div>
        </div>
    </div>

    <!-- 武器差し替え選択モーダル（現在アクティブな保存枠に適用） -->
    <div id="fakeWeaponModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4"
        onclick="if(event.target===this) closeFakeWeaponModal()">
        <div class="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-4xl max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between p-4 border-b border-zinc-800 shrink-0">
                <h2 class="text-lg font-bold text-cyan-400">差し替え武器を選択</h2>
                <button onclick="closeFakeWeaponModal()" class="text-zinc-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div id="fakeWeaponGridStatus" class="p-4 text-sm text-zinc-400"></div>
            <div id="fakeWeaponGrid" class="picker-grid overflow-y-auto p-4 flex flex-wrap gap-2"></div>
        </div>
    </div>

    <script>
        const uid = document.getElementById('currentUid').textContent.trim();
        const scoreCalcSelect = document.getElementById('scoreCalcSelect');
        const regenerateApiBtn = document.getElementById('regenerateApiBtn');
        const cardImage = document.getElementById('cardImage');
        const placeholderText = document.getElementById('placeholderText');
        const loadingSpinner = document.getElementById('loadingSpinner');

        const comboRow = document.getElementById('comboRow');
        const editWeaponBtn = document.getElementById('editWeaponBtn');
        const editWeaponIcon = document.getElementById('editWeaponIcon');
        const editWeaponLabel = document.getElementById('editWeaponLabel');

        const fakeCharModal = document.getElementById('fakeCharModal');
        const fakeCharGrid = document.getElementById('fakeCharGrid');
        const fakeCharGridStatus = document.getElementById('fakeCharGridStatus');
        const fakeWeaponModal = document.getElementById('fakeWeaponModal');
        const fakeWeaponGrid = document.getElementById('fakeWeaponGrid');
        const fakeWeaponGridStatus = document.getElementById('fakeWeaponGridStatus');

        let currentSelectedCharId = null;

        let combos = [];
        let activeComboId = '';
        let defaultWeapon = '';

        let allCharList = {};
        let allWeaponList = {};
        let charIconCache = {};
        let weaponIconCache = {};
        let listsLoaded = false;
        const pendingIconFetches = new Set();
        let allCharIconsPromise = null;

        const TRAVELER_BASE_IDS = ['10000005', '10000007', '10000117', '10000118'];
        const ELEMENT_ORDER = ['Anemo', 'Geo', 'Electro', 'Dendro', 'Hydro', 'Pyro', 'Cryo'];

        function baseIdOf(id) {
            return String(id).split('-')[0];
        }

        function sortCharIds(ids) {
            const normal = [];
            const traveler = [];
            ids.forEach(id => {
                if (TRAVELER_BASE_IDS.includes(baseIdOf(id))) {
                    traveler.push(id);
                } else {
                    normal.push(id);
                }
            });

            normal.sort((a, b) => Number(baseIdOf(b)) - Number(baseIdOf(a)) || String(b).localeCompare(String(a)));

            traveler.sort((a, b) => {
                const baseDiff = TRAVELER_BASE_IDS.indexOf(baseIdOf(a)) - TRAVELER_BASE_IDS.indexOf(baseIdOf(b));
                if (baseDiff !== 0) return baseDiff;
                const elA = (allCharList[a] || {}).element || '';
                const elB = (allCharList[b] || {}).element || '';
                const elDiff = ELEMENT_ORDER.indexOf(elA) - ELEMENT_ORDER.indexOf(elB);
                if (elDiff !== 0) return elDiff;
                return String(a).localeCompare(String(b));
            });

            return [...normal, ...traveler];
        }

        async function loadFakeLists() {
            try {
                const listsBase = ver === 'beta' ? '/static/beta/data/lists' : '/static/data/lists';
                const [charRes, weaponRes] = await Promise.all([
                    fetch(`${listsBase}/characters.json`),
                    fetch(`${listsBase}/weapons.json`)
                ]);
                allCharList = charRes.ok ? await charRes.json() : {};
                allWeaponList = weaponRes.ok ? await weaponRes.json() : {};
            } catch (e) {
                console.error('fake_char / fake_weapon 用リストの取得に失敗しました:', e);
                allCharList = {};
                allWeaponList = {};
            }
            listsLoaded = true;

            if (currentSelectedCharId) {
                loadComboState(currentSelectedCharId);
                renderComboRow();
                updateEditWeaponUI();
                ensureComboIconsLoaded().then(() => renderComboRow());
                if (activeComboId || defaultWeapon) {
                    loadCardImage(currentSelectedCharId, false);
                }
            }
        }

        function ensureComboIconsLoaded() {
            const charIds = combos.map(c => c.fakeChar).filter(Boolean);
            const weaponIds = combos.map(c => c.fakeWeapon).filter(Boolean);
            if (defaultWeapon) weaponIds.push(defaultWeapon);
            return Promise.all([
                ensureCharIconsLoaded(charIds),
                ensureWeaponIconsLoaded(weaponIds)
            ]);
        }

        async function fetchCharIcon(id) {
            const key = `char:${id}`;
            if (charIconCache[id] !== undefined || pendingIconFetches.has(key)) return;
            pendingIconFetches.add(key);
            try {
                let fromBeta = false;
                let res = await fetch(`/static/data/characters/${id}.json`);
                if (!res.ok && ver === 'beta') {
                    fromBeta = true;
                    res = await fetch(`/static/beta/data/characters/${id}.json`);
                }
                if (res.ok) {
                    const data = await res.json();
                    charIconCache[id] = { icon: data.icon, fromBeta };
                }
            } catch (e) { /* skip individual failures */ }
            pendingIconFetches.delete(key);
        }

        async function fetchWeaponIcon(id) {
            const key = `weapon:${id}`;
            if (weaponIconCache[id] !== undefined || pendingIconFetches.has(key)) return;
            pendingIconFetches.add(key);
            try {
                let fromBeta = false;
                let res = await fetch(`/static/data/weapons/${id}.json`);
                if (!res.ok && ver === 'beta') {
                    fromBeta = true;
                    res = await fetch(`/static/beta/data/weapons/${id}.json`);
                }
                if (res.ok) {
                    const data = await res.json();
                    weaponIconCache[id] = { icon: data.icon, fromBeta };
                }
            } catch (e) { /* skip individual failures */ }
            pendingIconFetches.delete(key);
        }

        function charAssetUrl(id) {
            const entry = charIconCache[id];
            if (!entry || !entry.icon) return '';
            const root = entry.fromBeta ? '/static/beta/assets' : '/static/assets';
            return `${root}/characters/${entry.icon}.webp`;
        }

        function weaponAssetUrl(id) {
            const entry = weaponIconCache[id];
            if (!entry || !entry.icon) return '';
            const root = entry.fromBeta ? '/static/beta/assets' : '/static/assets';
            return `${root}/weapons/${entry.icon}.webp`;
        }

        function ensureCharIconsLoaded(ids) {
            const targets = [...new Set(ids)].filter(id => charIconCache[id] === undefined);
            return Promise.all(targets.map(fetchCharIcon));
        }

        function ensureWeaponIconsLoaded(ids) {
            const targets = [...new Set(ids)].filter(id => weaponIconCache[id] === undefined);
            return Promise.all(targets.map(fetchWeaponIcon));
        }

        function ensureAllCharIconsLoaded() {
            if (!allCharIconsPromise) {
                allCharIconsPromise = ensureCharIconsLoaded(Object.keys(allCharList));
            }
            return allCharIconsPromise;
        }

        function qualityToRarity(q) {
            if (q === 'QUALITY_ORANGE' || q === 'QUALITY_ORANGE_SP') return 5;
            if (q === 'QUALITY_PURPLE') return 4;
            if (q === 'QUALITY_BLUE') return 3;
            if (q === 'QUALITY_GREEN') return 2;
            return 1;
        }

        function realCharIconSrc(charId) {
            const thumb = document.querySelector(`.char-thumb[data-char-id="${charId}"] img`);
            return thumb ? thumb.getAttribute('src') : '';
        }

        function comboStorageKeys(charId) {
            return {
                list: `combo_list_${uid}_${charId}`,
                active: `combo_active_${uid}_${charId}`,
                defaultWeapon: `combo_default_weapon_${uid}_${charId}`
            };
        }

        function loadComboState(charId) {
            const keys = comboStorageKeys(charId);
            try {
                combos = JSON.parse(localStorage.getItem(keys.list)) || [];
            } catch (e) {
                combos = [];
            }
            activeComboId = localStorage.getItem(keys.active) || '';
            defaultWeapon = localStorage.getItem(keys.defaultWeapon) || '';

            if (activeComboId && !combos.find(c => c.id === activeComboId)) {
                activeComboId = '';
            }
        }

        function saveComboState(charId) {
            const keys = comboStorageKeys(charId);
            localStorage.setItem(keys.list, JSON.stringify(combos));
            localStorage.setItem(keys.active, activeComboId);
            localStorage.setItem(keys.defaultWeapon, defaultWeapon);
        }

        function getActiveCombo() {
            if (!activeComboId) return null;
            return combos.find(c => c.id === activeComboId) || null;
        }

        function getActiveSelection() {
            const combo = getActiveCombo();
            if (combo) return { fakeChar: combo.fakeChar, fakeWeapon: combo.fakeWeapon };
            return { fakeChar: '', fakeWeapon: defaultWeapon };
        }

        function getActiveWeaponType(charId) {
            const combo = getActiveCombo();
            const targetId = combo ? combo.fakeChar : charId;
            if (targetId && allCharList[targetId]) {
                return allCharList[targetId].weaponType;
            }
            return '';
        }

        function renderComboRow() {
            comboRow.innerHTML = '';

            const defaultTile = document.createElement('div');
            defaultTile.className = `combo-tile relative w-16 h-16 rounded-lg border-2 border-zinc-700 bg-zinc-800 cursor-pointer ${!activeComboId ? 'active' : ''}`;
            defaultTile.title = 'デフォルト（実データ）';
            const defaultIconSrc = currentSelectedCharId ? realCharIconSrc(currentSelectedCharId) : '';
            defaultTile.innerHTML = `
                <div class="relative w-full h-full rounded-md overflow-hidden">
                    ${defaultIconSrc ? `<img src="${defaultIconSrc}" class="w-full h-full object-cover drag-none">` : ''}
                    <div class="absolute bottom-0 inset-x-0 bg-black/70 text-[9px] leading-tight text-center truncate px-0.5">デフォルト</div>
                </div>
                ${defaultWeapon && weaponAssetUrl(defaultWeapon) ? `<div class="weapon-badge"><img src="${weaponAssetUrl(defaultWeapon)}" class="w-full h-full object-cover"></div>` : ''}
            `;
            defaultTile.onclick = () => activateCombo('');
            comboRow.appendChild(defaultTile);

            combos.forEach(combo => {
                const data = allCharList[combo.fakeChar];
                if (!data) return;
                const iconUrl = charAssetUrl(combo.fakeChar);
                const rarity = qualityToRarity(data.qualityType);

                const tile = document.createElement('div');
                tile.className = `combo-tile relative w-16 h-16 rounded-lg border-2 rarity-${rarity} bg-zinc-800 cursor-pointer ${activeComboId === combo.id ? 'active' : ''}`;
                tile.title = data.jaName;
                tile.onclick = () => activateCombo(combo.id);

                const weaponIconUrl = combo.fakeWeapon ? weaponAssetUrl(combo.fakeWeapon) : '';
                tile.innerHTML = `
                    <div class="relative w-full h-full rounded-md overflow-hidden">
                        ${iconUrl ? `<img src="${iconUrl}" class="w-full h-full object-cover drag-none">` : `<div class="w-full h-full flex items-center justify-center text-[9px] text-zinc-400 text-center px-1">${data.jaName}</div>`}
                        <div class="absolute bottom-0 inset-x-0 bg-black/70 text-[9px] leading-tight text-center truncate px-0.5">${data.jaName}</div>
                    </div>
                    <div class="combo-remove" onclick="event.stopPropagation(); removeCombo('${combo.id}')">&times;</div>
                    ${weaponIconUrl ? `<div class="weapon-badge"><img src="${weaponIconUrl}" class="w-full h-full object-cover"></div>` : ''}
                `;
                comboRow.appendChild(tile);
            });

            const addTile = document.createElement('div');
            addTile.className = 'w-16 h-16 rounded-lg border-2 border-dashed border-zinc-600 hover:border-cyan-400 flex items-center justify-center cursor-pointer text-2xl text-zinc-500 hover:text-cyan-400 transition-all';
            addTile.title = '差し替えキャラを追加';
            addTile.textContent = '+';
            addTile.onclick = openFakeCharModal;
            comboRow.appendChild(addTile);
        }

        function activateCombo(comboId) {
            activeComboId = comboId;
            saveComboState(currentSelectedCharId);
            renderComboRow();
            updateEditWeaponUI();
            loadCardImage(currentSelectedCharId, false);
        }

        function removeCombo(comboId) {
            combos = combos.filter(c => c.id !== comboId);
            if (activeComboId === comboId) {
                activeComboId = '';
            }
            saveComboState(currentSelectedCharId);
            renderComboRow();
            updateEditWeaponUI();
            loadCardImage(currentSelectedCharId, false);
        }

        async function openFakeCharModal() {
            fakeCharModal.classList.remove('hidden');
            fakeCharModal.classList.add('flex');
            renderFakeCharGrid();

            const missingIds = Object.keys(allCharList).filter(id => charIconCache[id] === undefined);
            if (missingIds.length) {
                fakeCharGridStatus.textContent = 'アイコンを読み込み中...';
                await ensureAllCharIconsLoaded();
                fakeCharGridStatus.textContent = '';
                renderFakeCharGrid();
            }
        }

        function closeFakeCharModal() {
            fakeCharModal.classList.add('hidden');
            fakeCharModal.classList.remove('flex');
        }

        function renderFakeCharGrid() {
            fakeCharGrid.innerHTML = '';

            const sortedIds = sortCharIds(Object.keys(allCharList));
            sortedIds.forEach(id => {
                const data = allCharList[id];
                const iconUrl = charAssetUrl(id);
                const rarity = qualityToRarity(data.qualityType);
                const tile = document.createElement('div');
                tile.className = `picker-tile relative w-24 h-24 shrink-0 cursor-pointer rounded-lg border-2 rarity-${rarity} bg-zinc-800 overflow-hidden`;
                tile.title = data.jaName;
                tile.onclick = () => addComboForChar(id);

                if (iconUrl) {
                    tile.innerHTML = `
                        <img src="${iconUrl}" class="w-full h-full object-cover drag-none" loading="lazy">
                        <div class="absolute bottom-0 inset-x-0 bg-black/70 text-[10px] leading-tight text-center truncate px-0.5 py-0.5">${data.jaName}</div>
                    `;
                } else {
                    tile.innerHTML = `<div class="w-full h-full flex items-center justify-center text-[10px] text-zinc-500 text-center px-1">${data.jaName}</div>`;
                }
                fakeCharGrid.appendChild(tile);
            });
        }

        function addComboForChar(fakeCharId) {
            const combo = {
                id: `combo_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                fakeChar: fakeCharId,
                fakeWeapon: ''
            };
            combos.push(combo);
            activeComboId = combo.id;
            saveComboState(currentSelectedCharId);
            renderComboRow();
            updateEditWeaponUI();
            closeFakeCharModal();
            loadCardImage(currentSelectedCharId, false);
        }

        async function openFakeWeaponModal() {
            fakeWeaponModal.classList.remove('hidden');
            fakeWeaponModal.classList.add('flex');
            renderFakeWeaponGrid();

            const weaponType = getActiveWeaponType(currentSelectedCharId);
            const relevantIds = Object.keys(allWeaponList)
                .filter(id => !weaponType || allWeaponList[id].weaponType === weaponType);
            const missingIds = relevantIds.filter(id => weaponIconCache[id] === undefined);

            if (missingIds.length) {
                fakeWeaponGridStatus.textContent = 'アイコンを読み込み中...';
                await ensureWeaponIconsLoaded(relevantIds);
                fakeWeaponGridStatus.textContent = '';
                renderFakeWeaponGrid();
            }
        }

        function closeFakeWeaponModal() {
            fakeWeaponModal.classList.add('hidden');
            fakeWeaponModal.classList.remove('flex');
        }

        function renderFakeWeaponGrid() {
            fakeWeaponGrid.innerHTML = '';
            fakeWeaponGridStatus.textContent = '';
            const weaponType = getActiveWeaponType(currentSelectedCharId);
            const selection = getActiveSelection();

            const noneTile = document.createElement('div');
            noneTile.className = `picker-tile relative w-16 h-16 shrink-0 cursor-pointer rounded-lg border-2 border-zinc-700 bg-zinc-800 flex items-center justify-center ${!selection.fakeWeapon ? 'selected' : ''}`;
            noneTile.title = 'なし（実データ）';
            noneTile.innerHTML = `<span class="text-2xl text-zinc-500">✕</span>`;
            noneTile.onclick = () => selectFakeWeapon('');
            fakeWeaponGrid.appendChild(noneTile);

            const sortedIds = Object.keys(allWeaponList)
                .filter(id => !weaponType || allWeaponList[id].weaponType === weaponType)
                .sort((a, b) => Number(a) - Number(b));

            if (weaponType && sortedIds.length === 0) {
                fakeWeaponGridStatus.textContent = 'この武器種の候補が見つかりませんでした。';
            }

            sortedIds.forEach(id => {
                const data = allWeaponList[id];
                const iconUrl = weaponAssetUrl(id);
                const rarity = qualityToRarity(data.qualityType);
                const tile = document.createElement('div');
                tile.className = `picker-tile relative w-16 h-16 shrink-0 cursor-pointer rounded-lg border-2 rarity-${rarity} bg-zinc-800 overflow-hidden ${selection.fakeWeapon === id ? 'selected' : ''}`;
                tile.title = data.jaName;
                tile.onclick = () => selectFakeWeapon(id);

                if (iconUrl) {
                    tile.innerHTML = `
                        <img src="${iconUrl}" class="w-full h-full object-cover drag-none" loading="lazy">
                        <div class="absolute bottom-0 inset-x-0 bg-black/70 text-[10px] leading-tight text-center truncate px-0.5 py-0.5">${data.jaName}</div>
                    `;
                } else {
                    tile.innerHTML = `<div class="w-full h-full flex items-center justify-center text-[10px] text-zinc-500 text-center px-1">${data.jaName}</div>`;
                }
                fakeWeaponGrid.appendChild(tile);
            });
        }

        function selectFakeWeapon(weaponId) {
            const combo = getActiveCombo();
            if (combo) {
                combo.fakeWeapon = weaponId;
            } else {
                defaultWeapon = weaponId;
            }
            saveComboState(currentSelectedCharId);
            renderComboRow();
            updateEditWeaponUI();
            closeFakeWeaponModal();
            loadCardImage(currentSelectedCharId, false);
        }

        function updateEditWeaponUI() {
            const selection = getActiveSelection();
            if (selection.fakeWeapon && allWeaponList[selection.fakeWeapon]) {
                const data = allWeaponList[selection.fakeWeapon];
                const iconUrl = weaponAssetUrl(selection.fakeWeapon);
                editWeaponLabel.textContent = data.jaName;
                if (iconUrl) {
                    editWeaponIcon.src = iconUrl;
                    editWeaponIcon.classList.remove('hidden');
                } else {
                    editWeaponIcon.classList.add('hidden');
                }
            } else {
                editWeaponLabel.textContent = 'なし（実データ）';
                editWeaponIcon.classList.add('hidden');
            }
        }

        editWeaponBtn.addEventListener('click', openFakeWeaponModal);

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('from_artifacter')) {
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?uid=${uid}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            }

            loadFakeLists();

            const savedCharId = localStorage.getItem(`selected_char_${uid}`);
            let targetThumb = savedCharId
                ? document.querySelector(`.char-thumb[data-char-id="${savedCharId}"]`)
                : null;
            if (!targetThumb) {
                targetThumb = document.querySelector('.char-thumb');
            }
            if (targetThumb) targetThumb.click();
        });

        function getSavedCalcMethod(charId) {
            return localStorage.getItem(`calc_method_${uid}_${charId}`) || "crit";
        }
        function saveCalcMethod(charId, method) {
            localStorage.setItem(`calc_method_${uid}_${charId}`, method);
        }

        let currentImageObjectUrl = null;
        let latestImageRequestToken = 0;

        async function loadCardImage(charId, forceFetch = false) {
            if(!charId) return;
            const charChanged = currentSelectedCharId !== charId;
            currentSelectedCharId = charId;

            const currentMethod = getSavedCalcMethod(charId);
            scoreCalcSelect.value = currentMethod;

            if (listsLoaded && charChanged) {
                loadComboState(charId);
                renderComboRow();
                updateEditWeaponUI();
                ensureComboIconsLoaded().then(() => renderComboRow());
            }

            loadingSpinner.classList.remove('hidden');
            placeholderText.classList.add('hidden');
            cardImage.classList.add('hidden');

            const selection = getActiveSelection();
            const params = new URLSearchParams();
            if (selection.fakeChar) params.set('fake_char', selection.fakeChar);
            if (selection.fakeWeapon) params.set('fake_weapon', selection.fakeWeapon);
            if (ver === 'beta') params.set('beta', 'true');
            if (forceFetch) params.set('_', new Date().getTime());
            const query = params.toString() ? `?${params.toString()}` : '';
            const url = `/generate_card_image/${uid}/${charId}/${currentMethod}${query}`;

            const requestToken = ++latestImageRequestToken;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`画像の取得に失敗しました (status: ${res.status})`);
                const blob = await res.blob();

                if (requestToken !== latestImageRequestToken) return;

                if (currentImageObjectUrl) {
                    URL.revokeObjectURL(currentImageObjectUrl);
                }
                currentImageObjectUrl = URL.createObjectURL(blob);
                cardImage.src = currentImageObjectUrl;
            } catch (e) {
                if (requestToken !== latestImageRequestToken) return;
                console.error('カード画像の読み込みに失敗しました:', e);
                loadingSpinner.classList.add('hidden');
                cardImage.classList.add('hidden');
                placeholderText.textContent = '画像の読み込みに失敗しました。もう一度お試しください。';
                placeholderText.classList.remove('hidden');
            }
        }

        cardImage.onload = function() {
            loadingSpinner.classList.add('hidden');
            cardImage.classList.remove('hidden');
        };

        document.querySelectorAll('.char-thumb').forEach(thumb => {
            thumb.addEventListener('click', function() {
                document.querySelectorAll('.char-thumb img').forEach(img => {
                    img.classList.remove('opacity-100', 'ring-2', 'ring-yellow-400');
                    img.classList.add('opacity-50', 'grayscale-[0.3]');
                });
                document.querySelectorAll('.check-badge').forEach(b => b.remove());

                const activeImg = this.querySelector('img');
                activeImg.classList.remove('opacity-50', 'grayscale-[0.3]');
                activeImg.classList.add('opacity-100', 'ring-2', 'ring-yellow-400');
                
                const badgeHTML = `<div class="check-badge absolute top-1 right-1 bg-cyan-400 rounded-full p-0.5 ring-2 ring-white/30"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="text-black"><path d="M20 6 9 17l-5-5"></path></svg></div>`;
                this.insertAdjacentHTML('beforeend', badgeHTML);

                const charId = this.getAttribute('data-char-id');
                localStorage.setItem(`selected_char_${uid}`, charId);
                loadCardImage(charId, false);
            });
        });

        scoreCalcSelect.addEventListener('change', function() {
            if (currentSelectedCharId) {
                saveCalcMethod(currentSelectedCharId, this.value);
                loadCardImage(currentSelectedCharId, false);
            }
        });

        regenerateApiBtn.addEventListener('click', async function() {
            if (!currentSelectedCharId) return;

            const originalLabel = regenerateApiBtn.innerHTML;
            regenerateApiBtn.disabled = true;
            regenerateApiBtn.classList.add('opacity-60', 'cursor-not-allowed');
            regenerateApiBtn.textContent = '取得中...';

            try {
                const res = await fetch(`/refresh_uid/${uid}`, { method: 'POST' });
                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    throw new Error(errBody.detail || `再取得に失敗しました (status: ${res.status})`);
                }
            } catch (e) {
                console.error('Enka APIの再取得に失敗しました:', e);
                alert(`データの再取得に失敗しました。\n${e.message}\n（キャッシュ済みのデータで再生成します）`);
            } finally {
                regenerateApiBtn.disabled = false;
                regenerateApiBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                regenerateApiBtn.innerHTML = originalLabel;
            }

            loadCardImage(currentSelectedCharId, true);
        });
    </script>
</body>
</html>
